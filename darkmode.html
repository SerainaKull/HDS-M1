<button id="theme-toggle" type="button" aria-label="Toggle dark mode">Dark Mode</button>

<script>
(function() {
  const btn = document.getElementById("theme-toggle");
  const root = document.documentElement;

  function setTheme(theme) {
    if (theme === "dark") {
      root.setAttribute("data-theme", "dark");
      btn.textContent = "Light Mode";
    } else {
      root.removeAttribute("data-theme");
      btn.textContent = "Dark Mode";
    }
    localStorage.setItem("rmd-auburn-theme", theme);
  }

  // Initialize from saved preference or OS setting
  const saved = localStorage.getItem("rmd-auburn-theme");
  setTheme(saved ? saved : "light");

  btn.addEventListener("click", function() {
    const isDark = root.getAttribute("data-theme") === "dark";
    setTheme(isDark ? "light" : "dark");
  });
})();
</script>
